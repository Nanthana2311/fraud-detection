<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraud Detection - Transaction Scanner</title>
<style>
  :root { --ind:#4f46e5; --ind2:#4338ca; --bg:#eef2ff; --card:#fff; --red:#dc2626; --green:#16a34a; --amber:#d97706; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',system-ui,sans-serif; }
  body { background:linear-gradient(160deg,#eef2ff,#e0e7ff); min-height:100vh; padding:24px 16px; }
  .wrap { max-width:900px; margin:0 auto; }
  header { text-align:center; margin-bottom:18px; }
  header h1 { color:var(--ind2); font-size:27px; }
  header p { color:#4f46e5; opacity:.85; margin-top:6px; font-size:14.5px; }
  .card { background:var(--card); border-radius:16px; box-shadow:0 10px 30px rgba(79,70,229,.14); padding:22px; }
  .samples { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:18px; }
  .sample { padding:10px 18px; border-radius:10px; border:none; font-size:14px; font-weight:600; cursor:pointer; transition:.15s; }
  .sample.n { background:#dcfce7; color:#166534; }
  .sample.n:hover { background:#bbf7d0; }
  .sample.f { background:#fee2e2; color:#991b1b; }
  .sample.f:hover { background:#fecaca; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
  label { display:block; font-size:11px; font-weight:600; color:#3730a3; margin-bottom:4px; font-family:Consolas,monospace; }
  input { width:100%; padding:8px 9px; border:1.5px solid #c7d2fe; border-radius:8px; font-size:13px; font-family:Consolas,monospace; background:#f8faff; color:#1e1b4b; }
  input:focus { outline:none; border-color:var(--ind); box-shadow:0 0 0 3px rgba(79,70,229,.15); }
  .actions { margin-top:18px; display:flex; justify-content:center; }
  #scan { background:linear-gradient(90deg,var(--ind),var(--ind2)); color:#fff; padding:13px 34px; border:none; border-radius:11px; font-size:15px; font-weight:700; cursor:pointer; transition:.15s; }
  #scan:hover { transform:translateY(-1px); box-shadow:0 8px 20px rgba(79,70,229,.35); }
  #scan:disabled { opacity:.55; cursor:wait; }
  .result { margin-top:20px; padding:20px; border-radius:14px; display:none; }
  .result.fraud { background:#fef2f2; border:2px solid #fecaca; }
  .result.normal { background:#f0fdf4; border:2px solid #bbf7d0; }
  .result .big { font-size:26px; font-weight:800; }
  .result.fraud .big { color:var(--red); } .result.normal .big { color:var(--green); }
  .result .prob { font-size:15px; color:#334155; margin-top:5px; }
  .badge { display:inline-block; padding:4px 14px; border-radius:99px; font-size:12px; font-weight:700; margin-top:10px; }
  .badge.HIGH { background:#fee2e2; color:#991b1b; } .badge.MEDIUM { background:#fef9c3; color:#854d0e; } .badge.LOW { background:#dcfce7; color:#166534; }
  .shap { margin-top:16px; border-top:1px dashed #cbd5e1; padding-top:14px; }
  .shap h4 { font-size:13px; color:#3730a3; margin-bottom:10px; font-family:Consolas,monospace; }
  .shap-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13px; }
  .shap-row .f { width:52px; font-family:Consolas,monospace; font-weight:700; color:#4f46e5; }
  .shap-row .bar { height:14px; border-radius:4px; min-width:4px; }
  .shap-row .txt { color:#475569; font-size:12.5px; }
  .note { text-align:center; font-size:12px; color:#64748b; margin-top:14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🕵️ Credit Card Fraud Scanner</h1>
    <p>Random Forest + SMOTE · SHAP explainability · 284k transactions, 0.17% fraud</p>
  </header>

  <div class="card">
    <div class="samples">
      <button class="sample n" onclick="fillNormal()">💚 Load a normal transaction</button>
      <button class="sample f" onclick="fillFraud()">🚨 Load a fraud-like transaction</button>
    </div>
    <form id="form" class="grid" onsubmit="scan(event)">
      <div id="fields"></div>
      <div style="grid-column:1/-1"><label>Amount (USD)</label><input id="Amount" type="number" step="0.01" value="50.00"></div>
    </form>
    <div class="actions"><button id="scan" type="button" onclick="scan()">🔍 Scan Transaction</button></div>
    <div id="result" class="result"></div>
  </div>
  <p class="note">V1–V28 are anonymized PCA components (the dataset hides real card details). Model is deployed from a Kaggle-style credit card fraud dataset.</p>
</div>

<script>
const V = Array.from({length:28}, (_,i) => "V"+(i+1));
const FIELDS = V.concat("Amount");

function buildFields() {
  const box = document.getElementById("fields");
  box.innerHTML = "";
  V.forEach(v => {
    const d = document.createElement("div");
    const l = document.createElement("label"); l.textContent = v;
    const inp = document.createElement("input");
    inp.id = v; inp.type = "number"; inp.step = "any"; inp.value = "0";
    d.appendChild(l); d.appendChild(inp); box.appendChild(d);
  });
}
buildFields();

function fillNormal() {
  const base = {V1:-1.36,V2:-0.073,V3:2.536,V4:1.378,V5:-0.338,V6:0.462,V7:0.24,V8:0.099,V9:0.364,V10:0.091,V11:-0.552,V12:-0.618,V13:-0.991,V14:-0.311,V15:1.468,V16:-0.47,V17:0.208,V18:0.026,V19:0.404,V20:0.251,V21:-0.018,V22:0.278,V23:-0.11,V24:0.067,V25:0.129,V26:-0.189,V27:0.134,V28:-0.021,Amount:149.62};
  setVals(base); hide();
}
function fillFraud() {
  const base = {V1:-2.312,V2:1.952,V3:-1.61,V4:3.998,V5:-0.522,V6:-1.427,V7:-2.537,V8:1.392,V9:-2.77,V10:-2.772,V11:3.202,V12:-2.9,V13:-0.595,V14:-4.289,V15:0.39,V16:-1.141,V17:-2.83,V18:-0.017,V19:0.417,V20:0.127,V21:0.517,V22:-0.035,V23:-0.465,V24:0.32,V25:0.045,V26:0.178,V27:0.261,V28:-0.143,Amount:123.45};
  setVals(base); hide();
}
function setVals(o){ FIELDS.forEach(f => { const el = document.getElementById(f); if(el) el.value = o[f] ?? 0; }); }
function hide(){ const r = document.getElementById("result"); r.style.display="none"; }

function readVals(){ const o={}; FIELDS.forEach(f => { const el=document.getElementById(f); o[f]=parseFloat(el.value)||0; }); return o; }

async function scan(e){ if(e) e.preventDefault();
  const btn = document.getElementById("scan");
  btn.disabled = true; btn.textContent = "Scanning…";
  try {
    const res = await fetch("/predict", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(readVals()) });
    const d = await res.json();
    const r = document.getElementById("result");
    r.className = "result " + (d.prediction==="Fraud" ? "fraud" : "normal");
    let html = `<div class="big">${d.prediction}</div>`;
    html += `<div class="prob">Fraud probability: ${(d.fraud_probability*100).toFixed(1)}% (threshold ${(d.threshold*100).toFixed(0)}%)</div>`;
    html += `<span class="badge ${d.risk}">${d.risk} RISK</span>`;
    if (d.explanation && d.explanation.length) {
      html += `<div class="shap"><h4>WHY? — SHAP EXPLANATION (top contributors)</h4>`;
      d.explanation.forEach(x => {
        const w = Math.min(100, Math.abs(x.shap)*220);
        const color = x.shap > 0 ? "#dc2626" : "#16a34a";
        html += `<div class="shap-row"><span class="f">${x.feature}</span><span class="bar" style="width:${w}px;background:${color}"></span><span class="txt">${x.impact}</span></div>`;
      });
      html += `</div>`;
    }
    r.innerHTML = html; r.style.display = "block";
  } catch(err){ alert("Error: " + err.message); }
  finally { btn.disabled=false; btn.textContent="🔍 Scan Transaction"; }
}
</script>
</body>
</html>
